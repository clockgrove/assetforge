name: CI

# The one required check. The repository's command contract is: pnpm install --frozen-lockfile
# --ignore-scripts, then pnpm check (format, lint, types), then pnpm test (offline; scripted
# generation provider, no real model calls).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    # Decision: the offline suite is expected to take minutes; 20 bounds a hung run.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Enable pnpm from packageManager
        run: corepack enable

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test
